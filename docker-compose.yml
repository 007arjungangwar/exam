services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: exam
      POSTGRES_DB: exam_platform
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam -d exam_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  sandbox-builder:
    build:
      context: ./sandbox/python
    image: exam-python-sandbox:latest
    profiles: ["build-only"]

volumes:
  pgdata:
